
name: Connect Maya Telegram Webhook

on:
  workflow_dispatch:

jobs:
  setup-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Register Telegram webhook
        env:
          WORKER_URL: https://maya-telegram-bot.mahehassan69.workers.dev
          WEBHOOK_SETUP_KEY: ${{ secrets.WEBHOOK_SETUP_KEY }}
        run: |
          if [ -z "$WEBHOOK_SETUP_KEY" ]; then
            echo "Missing WEBHOOK_SETUP_KEY GitHub secret."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${WORKER_URL}/setup" \
            --header "X-Setup-Key: ${WEBHOOK_SETUP_KEY}" \
            --header "Content-Type: application/json"

